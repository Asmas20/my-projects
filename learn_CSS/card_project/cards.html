<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card project</title>
    <link rel="stylesheet" href="cards.css">
</head>
<body>
    <h1>Money</h1>
    <header>
        <ul>
            <li><a href="#earn">Earn</a></li>
            <li><a href="#grow">Grow</a></li>
            <li><a href="#give">Give</a></li>
        </ul>
    </header>
    <main>
        <article id="earn" class="disp">
            <figure >
                <img src="../CSS/images1/bill_gates.jpg" alt="bill gates" width="250" height="250">
                <figcaption >Bill Gates</figcaption>
            </figure>
            <p>&quot;Let's earn money&quot;</p>
     
        </article>
        <article id="grow" class="disp">
            <figure  >
                <img src="../CSS/images1/elon.jpg" alt="elon musk" width="250" height="250">
                <figcaption class="wrapp">Elon Musk</figcaption>
            </figure>
            <p>&quot;Let's grow money&quot;</p>
        
        </article>
        <article id="give"  class="disp">
            <figure  >
                <img src="../CSS/images1/ratan.jpg" alt="ratan tata" width="250" height="250">
                <figcaption >Ratan Tata</figcaption>
            </figure>
            <p>&quot;Let's give money&quot;</p>
       
        </article>
    </main>
    <footer>
        <h3>&copy;Money</h3>
    </footer>
</body>
</html>
